
plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
    id 'idea'
    id 'maven-publish'
}

def prop = { key -> project.findProperty(key).toString() }

def modId = prop('mod_id')
def mcVersion = prop('minecraft_version')

version = prop('mod_version')
group = prop('mod_group_id')

base {
    archivesName = "${modId}-${mcVersion}"
}

repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven { url = 'https://maven.parchmentmc.org' }
    mavenCentral()
}

neoForge {
    version = prop('neo_version')

    parchment {
        minecraftVersion = prop('parchment_minecraft_version')
        mappingsVersion = prop('parchment_mappings_version')
    }

    runs {
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
            systemProperty 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
        }

        client {
            client()
            gameDirectory = file('run')
        }

        server {
            server()
            gameDirectory = file('run-server')
        }

        data {
            data()
            gameDirectory = file('run')
            programArguments.addAll(
                    '--mod', modId,
                    '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath,
                    '--existing-mod', 'dynamictrees',
                    '--existing-mod', 'vanillabackport'
            )
        }
    }

    mods {
        "${modId}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

tasks.named('processResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def replaceProperties = [
            loader_version_range : prop('loader_version_range'),
            mod_id               : prop('mod_id'),
            mod_name             : prop('mod_name'),
            mod_license          : prop('mod_license'),
            mod_version          : prop('mod_version'),
            mod_authors          : prop('mod_authors'),
            mod_description      : prop('mod_description'),
            minecraft_version_range: prop('minecraft_version_range'),
            dynamic_trees_version: prop('dynamic_trees_version'),
            vanilla_backport_version: prop('vanilla_backport_version'),
            platform_version     : prop('platform_version')
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}
