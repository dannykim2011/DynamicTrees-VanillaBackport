plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle'
    id 'idea'
    id 'maven-publish'
}

def prop = { key -> project.findProperty(key).toString() }
def modId = prop('mod_id')
def mcVersion = prop('minecraft_version')

version = prop('mod_version')
group = prop('mod_group_id')

base {
    archivesName = "${modId}-${mcVersion}"
}

repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    mavenCentral()
}

minecraft {
    mappings channel: 'official', version: mcVersion

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.disableRefMap', 'true'

            mods {
                "${modId}" {
                    source sourceSets.main
                }
            }
        }

        client {}

        server {
            workingDirectory project.file('run-server')
            args '--nogui'
        }

        data {
            workingDirectory project.file('run')
            args '--mod', modId,
                    '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath,
                    '--existing-mod', 'dynamictrees',
                    '--existing-mod', 'vanillabackport'
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

dependencies {
    minecraft "net.minecraftforge:forge:${mcVersion}-${prop('forge_version')}"
}

tasks.named('processResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def replaceProperties = [
            mod_id                : prop('mod_id'),
            mod_name              : prop('mod_name'),
            mod_license           : prop('mod_license'),
            mod_version           : prop('mod_version'),
            mod_authors           : prop('mod_authors'),
            mod_description       : prop('mod_description'),
            dynamic_trees_version : prop('dynamic_trees_version'),
            vanilla_backport_version: prop('vanilla_backport_version'),
            platform_version      : prop('platform_version')
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}
