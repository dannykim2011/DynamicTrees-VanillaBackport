modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mixins]]
config="dtvanillabackport.neoforge.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="${mod_id}.png"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.dtvanillabackport]]
modId="neoforge"
type="required"
versionRange="[21.1,)"
ordering="NONE"
side="BOTH"

[[dependencies.dtvanillabackport]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.dtvanillabackport]]
modId="dynamictrees"
type="required"
versionRange="[${dynamic_trees_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.dtvanillabackport]]
modId="vanillabackport"
type="required"
versionRange="[${vanilla_backport_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.dtvanillabackport]]
modId="platform"
type="required"
versionRange="[${platform_version},)"
ordering="AFTER"
side="BOTH"
